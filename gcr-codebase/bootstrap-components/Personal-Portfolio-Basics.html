<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="Personal-Portfolio-Basics.css">
</head>

<body class="bg-light text-dark">

<header class="container text-center mt-4">

    <h1 class="fw-bold">
        Kunal Sharma
    </h1>

    <p class="lead">
        Web Developer and Programmer
    </p>

</header>

<main>

    <section class="container text-center p-5">

        <img src="https://picsum.photos/200"
             class="img-fluid rounded-circle profile-image"
             alt="Profile">

        <h2 class="mt-4">
            Hello, I am Kunal
        </h2>

        <p class="mb-3">
            I am learning web development and creating modern websites.
        </p>

        <button class="btn btn-primary me-2">
            Hire Me
        </button>

        <button class="btn btn-success">
            Download CV
        </button>

    </section>

    <section class="container mb-5">

        <h2 class="text-center mb-3">
            Contact Me
        </h2>

        <form class="mx-auto form-box">

            <input type="text"
                   class="form-control mb-3"
                   placeholder="Enter your name">

            <input type="email"
                   class="form-control mb-3"
                   placeholder="Enter your email">

            <textarea class="form-control mb-3"
                      rows="4"
                      placeholder="Enter your message"></textarea>

            <button class="btn btn-primary w-100">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer class="bg-dark text-white text-center p-4">

    <p class="mb-0">
        © 2026 Kunal Sharma
    </p>

</footer>

</body>
</html>
