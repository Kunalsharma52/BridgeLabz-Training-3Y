<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Pagination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="Blog-Pagination-Pager.css">
</head>

<body>

<header class="bg-primary text-white text-center p-5">

    <h1>My Technology Blog</h1>

    <p class="lead">
        Latest articles and tutorials
    </p>

</header>

<main class="container py-5">

    <div class="row g-4">

        <div class="col-md-6">

            <div class="card">

                <div class="card-body">

                    <h2 class="card-title">
                        Learn HTML
                    </h2>

                    <p class="card-text">
                        HTML is used to create the structure of a webpage.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card">

                <div class="card-body">

                    <h2 class="card-title">
                        Learn CSS
                    </h2>

                    <p class="card-text">
                        CSS is used to design and style webpages.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>

        </div>

    </div>

    <nav class="mt-5">

        <ul class="pagination justify-content-center">

            <li class="page-item">
                <a class="page-link" href="#">
                    Previous
                </a>
            </li>

            <li class="page-item active">
                <a class="page-link" href="#">
                    1
                </a>
            </li>

            <li class="page-item">
                <a class="page-link" href="#">
                    2
                </a>
            </li>

            <li class="page-item">
                <a class="page-link" href="#">
                    Next
                </a>
            </li>

        </ul>

    </nav>

    <div class="d-flex justify-content-between mt-4">

        <button class="btn btn-outline-secondary">
            Older Posts
        </button>

        <button class="btn btn-outline-secondary">
            Newer Posts
        </button>

    </div>

</main>

<footer class="bg-dark text-white text-center p-4">

    <p class="mb-0">
        © 2026 My Technology Blog
    </p>

</footer>

</body>
</html>
