<h1>How a Browser Displays a Web Page</h1>

<p>1. User enters a website address.</p>
<p>2. Browser sends a request to the server.</p>
<p>3. Server receives the request.</p>
<p>4. Server sends the webpage back.</p>
<p>5. Browser displays the webpage.</p>

<p>Browser -&gt; Server -&gt; Browser</p>
