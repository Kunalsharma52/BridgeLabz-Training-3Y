
<!DOCTYPE html>
<html>
<head>
    <title>Product Manager</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
        }

        button {
            background: purple;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        #output {
            margin-top: 20px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Product Manager</h1>

    <button onclick="showProducts()">Show Products</button>
    <button onclick="showExpensive()">Price Above 1000</button>

    <div id="output"></div>
</div>

<script>
    // Product class
    class Product {
        constructor(id, name, price, category) {
            this.id = id;
            this.name = name;
            this.price = price;
            this.category = category;
        }

        applyDiscount(percent) {
            this.price = this.price - (this.price * percent / 100);
        }

        displayDetails() {
            return "ID: " + this.id +
                "\nName: " + this.name +
                "\nPrice: Rs. " + this.price +
                "\nCategory: " + this.category;
        }
    }

    // Creating product objects
    let products = [
        new Product(1, "Laptop", 55000, "Electronics"),
        new Product(2, "Headphones", 1500, "Electronics"),
        new Product(3, "Notebook", 80, "Stationery"),
        new Product(4, "Keyboard", 1200, "Electronics")
    ];

    // Apply 10% discount
    products[1].applyDiscount(10);

    function showProducts() {
        let output = "";

        products.forEach(function(product) {
            output += product.displayDetails() + "\n\n";
        });

        document.getElementById("output").textContent = output;
    }

    function showExpensive() {
        let expensive = products.filter(function(product) {
            return product.price > 1000;
        });

        let output = "";

        expensive.forEach(function(product) {
            output += product.displayDetails() + "\n\n";
        });

        document.getElementById("output").textContent = output;
    }
</script>

</body>
</html>
