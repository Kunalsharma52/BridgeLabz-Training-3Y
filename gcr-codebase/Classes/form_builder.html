
<!DOCTYPE html>
<html>
<head>
    <title>Custom Form Builder</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background: purple;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        #output {
            margin-top: 20px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Custom Form Builder</h1>

    <div id="dynamicForm"></div>

    <div id="output"></div>
</div>

<script>
    class FormBuilder {
        constructor(fields) {
            this.fields = fields;
        }

        createForm() {
            let html = '<form id="myForm">';

            this.fields.forEach(function(field) {
                html += '<label>' + field.label + '</label>';
                html += '<input type="' + field.type +
                    '" id="' + field.name + '" required>';
            });

            html += '<button type="submit">Submit</button>';
            html += '</form>';

            document.getElementById("dynamicForm").innerHTML = html;

            document.getElementById("myForm").addEventListener("submit", (event) => {
                event.preventDefault();

                let data = this.getFormData();

                document.getElementById("output").textContent =
                    JSON.stringify(data, null, 2);
            });
        }

        getFormData() {
            let data = {};

            this.fields.forEach(function(field) {
                data[field.name] =
                    document.getElementById(field.name).value;
            });

            return data;
        }
    }

    // Fields for creating the form
    let fields = [
        { type: "text", label: "Username", name: "username" },
        { type: "email", label: "Email", name: "email" },
        { type: "number", label: "Age", name: "age" }
    ];

    let form = new FormBuilder(fields);
    form.createForm();
</script>

</body>
</html>
