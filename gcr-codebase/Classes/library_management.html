
<!DOCTYPE html>
<html>
<head>
    <title>Library Management</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 95%;
        }

        button {
            background: purple;
            color: white;
            padding: 10px;
            border: none;
            margin: 5px;
            cursor: pointer;
        }

        #output {
            white-space: pre-line;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Library Management</h1>

    <input type="text" id="isbn" placeholder="Enter ISBN">

    <button onclick="issueBook()">Issue Book</button>
    <button onclick="returnBook()">Return Book</button>
    <button onclick="showAvailable()">Available Books</button>
    <button onclick="showAll()">All Books</button>

    <div id="output"></div>
</div>

<script>
    class Book {
        constructor(title, author, ISBN, isIssued) {
            this.title = title;
            this.author = author;
            this.ISBN = ISBN;
            this.isIssued = isIssued;
        }

        issueBook() {
            if (!this.isIssued) {
                this.isIssued = true;
                return "Book issued successfully.";
            }

            return "Book is already issued.";
        }

        returnBook() {
            if (this.isIssued) {
                this.isIssued = false;
                return "Book returned successfully.";
            }

            return "Book was not issued.";
        }
    }

    let books = [
        new Book("The Alchemist", "Paulo Coelho", "101", false),
        new Book("Wings of Fire", "A.P.J Abdul Kalam", "102", false),
        new Book("Atomic Habits", "James Clear", "103", true),
        new Book("Rich Dad Poor Dad", "Robert Kiyosaki", "104", false)
    ];

    function findBook() {
        let isbn = document.getElementById("isbn").value;

        return books.find(function(book) {
            return book.ISBN === isbn;
        });
    }

    function issueBook() {
        let book = findBook();

        if (book) {
            document.getElementById("output").textContent =
                book.issueBook();
        } else {
            document.getElementById("output").textContent = "Book not found.";
        }
    }

    function returnBook() {
        let book = findBook();

        if (book) {
            document.getElementById("output").textContent =
                book.returnBook();
        } else {
            document.getElementById("output").textContent = "Book not found.";
        }
    }

    function showAvailable() {
        let available = books.filter(function(book) {
            return !book.isIssued;
        });

        displayBooks(available);
    }

    function showAll() {
        displayBooks(books);
    }

    function displayBooks(list) {
        let output = "";

        list.forEach(function(book) {
            output += "Title: " + book.title +
                "\nAuthor: " + book.author +
                "\nISBN: " + book.ISBN +
                "\nStatus: " + (book.isIssued ? "Issued" : "Available") +
                "\n\n";
        });

        document.getElementById("output").textContent =
            output || "No books available.";
    }
</script>

</body>
</html>
