
<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Object Updater</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0 15px;
        }

        button {
            background: purple;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        #output {
            background: #eee;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Dynamic Object Updater</h1>

    <form id="userForm">

        <label>Name:</label>
        <input type="text" id="name"
        placeholder="Enter your name" required>

        <label>Email:</label>
        <input type="email" id="email"
        placeholder="Enter your email" required>

        <label>Age:</label>
        <input type="number" id="age"
        placeholder="Enter your age" min="1" required>

        <button type="submit">Update User</button>

    </form>

    <h2>Updated User Details</h2>

    <div id="output">No details updated yet.</div>

</div>

<script>

    // Original user object
    let user = {
        name: "John",
        email: "john@mail.com",
        age: 21
    };

    // Display user details
    function displayUser() {

        document.getElementById("output").textContent =
            "Name: " + user.name +
            "\nEmail: " + user.email +
            "\nAge: " + user.age;
    }

    // Update user object after form submission
    document.getElementById("userForm").addEventListener("submit", function(event) {

        event.preventDefault();

        // Get values from input fields
        let newName = document.getElementById("name").value;
        let newEmail = document.getElementById("email").value;
        let newAge = Number(document.getElementById("age").value);

        // Update original object
        user.name = newName;
        user.email = newEmail;
        user.age = newAge;

        // Display updated details
        displayUser();

    });

</script>

</body>
</html>
