
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 550px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background: purple;
            color: white;
            padding: 10px 20px;
            border: none;
            margin-top: 10px;
        }

        #output {
            white-space: pre-line;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Shopping Cart</h1>

    <form id="itemForm">
        <label>Item Name</label>
        <input type="text" id="itemName" required>

        <label>Price</label>
        <input type="number" id="price" min="0.01" step="0.01" required>

        <label>Quantity</label>
        <input type="number" id="quantity" min="1" value="1" required>

        <button type="submit">Add Item</button>
    </form>

    <h2>Coupon Code</h2>
    <input type="text" id="coupon" placeholder="SAVE20 or DISC10">

    <button onclick="applyCoupon()">Apply Coupon</button>

    <div id="output"></div>
</div>

<script>
    class Cart {
        constructor() {
            this.items = [];
            this.discount = 0;
        }

        addItem(name, price, quantity) {
            this.items.push({
                name: name,
                price: price,
                quantity: quantity
            });
        }

        getTotal() {
            let total = 0;

            this.items.forEach(function(item) {
                total += item.price * item.quantity;
            });

            return total;
        }

        getFinalTotal() {
            return this.getTotal() -
                (this.getTotal() * this.discount / 100);
        }
    }

    let cart = new Cart();

    document.getElementById("itemForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let name = document.getElementById("itemName").value;
        let price = Number(document.getElementById("price").value);
        let quantity = Number(document.getElementById("quantity").value);

        if (price <= 0 || quantity < 1 || !Number.isInteger(quantity)) {
            alert("Enter valid price and quantity.");
            return;
        }

        cart.addItem(name, price, quantity);

        cart.discount = 0;

        document.getElementById("itemForm").reset();
        document.getElementById("quantity").value = 1;

        displayCart();
    });

    function applyCoupon() {
        let coupon = document.getElementById("coupon").value.trim().toUpperCase();

        let pattern = /^(SAVE20|DISC10)$/;

        if (!pattern.test(coupon)) {
            alert("Invalid coupon code.");
            return;
        }

        if (cart.items.length === 0) {
            alert("Add an item first.");
            return;
        }

        if (coupon === "SAVE20") {
            cart.discount = 20;
        } else if (coupon === "DISC10") {
            cart.discount = 10;
        }

        displayCart();
    }

    function displayCart() {
        let output = "Shopping Cart Details\n\n";

        cart.items.forEach(function(item) {
            output += item.name +
                " - Rs. " + item.price +
                " x " + item.quantity +
                " = Rs. " + (item.price * item.quantity) + "\n";
        });

        output += "\nSubtotal: Rs. " + cart.getTotal();
        output += "\nDiscount: " + cart.discount + "%";
        output += "\nFinal Total: Rs. " + cart.getFinalTotal();

        document.getElementById("output").textContent = output;
    }

    displayCart();
</script>

</body>
</html>
