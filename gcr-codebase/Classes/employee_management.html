
<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
        }

        button {
            background: purple;
            color: white;
            padding: 10px;
            border: none;
            margin: 5px;
        }

        #output {
            white-space: pre-line;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Employee Management</h1>

    <button onclick="showEmployees()">Show Employees</button>
    <button onclick="applyBonus()">Apply 10% Bonus</button>

    <div id="output"></div>
</div>

<script>
    class Employee {
        constructor(id, name, department, salary) {
            this.id = id;
            this.name = name;
            this.department = department;
            this.salary = salary;
        }

        getAnnualSalary() {
            return this.salary * 12;
        }

        applyBonus(percent) {
            this.salary = this.salary + (this.salary * percent / 100);
        }
    }

    // Create five employees
    let employees = [
        new Employee(1, "Aman", "IT", 30000),
        new Employee(2, "Riya", "HR", 25000),
        new Employee(3, "Rahul", "Sales", 28000),
        new Employee(4, "Neha", "IT", 35000),
        new Employee(5, "Karan", "Finance", 32000)
    ];

    function showEmployees() {
        let output = "";

        employees.forEach(function(employee) {
            output += "ID: " + employee.id +
                "\nName: " + employee.name +
                "\nDepartment: " + employee.department +
                "\nAnnual Salary: Rs. " +
                employee.getAnnualSalary() + "\n\n";
        });

        // Calculate total annual payout using reduce()
        let total = employees.reduce(function(sum, employee) {
            return sum + employee.getAnnualSalary();
        }, 0);

        output += "Total Annual Payout: Rs. " + total;

        document.getElementById("output").textContent = output;
    }

    function applyBonus() {
        employees.forEach(function(employee) {
            employee.applyBonus(10);
        });

        showEmployees();
    }
</script>

</body>
</html>
