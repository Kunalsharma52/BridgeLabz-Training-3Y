
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background: purple;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        .error {
            color: red;
        }

        .valid {
            border: 2px solid green;
        }

        .invalid {
            border: 2px solid red;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Student Registration</h1>

    <form id="studentForm">

        <label>Name</label>
        <input type="text" id="name">
        <p id="nameError" class="error"></p>

        <label>Email</label>
        <input type="text" id="email">
        <p id="emailError" class="error"></p>

        <label>Phone</label>
        <input type="text" id="phone">
        <p id="phoneError" class="error"></p>

        <label>Password</label>
        <input type="password" id="password">
        <p id="passwordError" class="error"></p>

        <button type="submit">Register</button>
    </form>

    <h3 id="result"></h3>
</div>

<script>
    document.getElementById("studentForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let name = document.getElementById("name");
        let email = document.getElementById("email");
        let phone = document.getElementById("phone");
        let password = document.getElementById("password");

        let valid = true;

        let namePattern = /^[A-Za-z ]+$/;
        let emailPattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
        let phonePattern = /^[0-9]{10}$/;
        let passwordPattern = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$/;

        function check(input, pattern, errorId, message) {
            let error = document.getElementById(errorId);

            if (pattern.test(input.value.trim())) {
                input.className = "valid";
                error.textContent = "";
            } else {
                input.className = "invalid";
                error.textContent = message;
                valid = false;
            }
        }

        check(name, namePattern, "nameError", "Only alphabets allowed.");
        check(email, emailPattern, "emailError", "Enter valid email.");
        check(phone, phonePattern, "phoneError", "Enter exactly 10 digits.");
        check(password, passwordPattern, "passwordError",
            "Include uppercase, number and special character.");

        let result = document.getElementById("result");

        if (valid) {
            result.textContent = "Registration Successful!";
            result.style.color = "green";
        } else {
            result.textContent = "Please correct the errors.";
            result.style.color = "red";
        }
    });
</script>

</body>
</html>
