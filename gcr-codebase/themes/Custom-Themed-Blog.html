<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="Custom-Themed-Blog.css">
</head>

<body>

<header class="container py-4">

    <h1 class="text-primary fw-bold">
        My Technology Blog
    </h1>

    <p>
        Learn technology in a simple way.
    </p>

</header>

<main class="container">

    <div class="row g-4">

        <div class="col-md-6">

            <div class="card h-100">

                <img src="https://picsum.photos/600/300?5"
                     class="card-img-top"
                     alt="Technology">

                <div class="card-body">

                    <h2 class="card-title">
                        Introduction to Web Development
                    </h2>

                    <p class="card-text">
                        Learn the basics of HTML, CSS and Bootstrap.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card h-100">

                <img src="https://picsum.photos/600/300?6"
                     class="card-img-top"
                     alt="Coding">

                <div class="card-body">

                    <h2 class="card-title">
                        Why Learn Bootstrap?
                    </h2>

                    <p class="card-text">
                        Bootstrap helps developers create responsive websites quickly.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>

<footer class="text-center text-white mt-5 p-4">

    <p class="mb-0">
        © 2026 My Technology Blog
    </p>

</footer>

</body>
</html>
