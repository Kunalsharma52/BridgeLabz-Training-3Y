<!DOCTYPE html>
<html>
<head>
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="Borders-Padding-Demonstration-Page.css">
</head>

<body>

    <header>
        <h1>Borders and Padding</h1>
    </header>

    <main>

        <div class="container">

            <div class="box solid">
                Solid Border
            </div>

            <div class="box dashed">
                Dashed Border
            </div>

            <div class="box double">
                Double Border
            </div>

            <div class="box groove">
                Groove Border
            </div>

        </div>

        <div class="container">

            <div class="box round1">
                Small Radius
            </div>

            <div class="box round2">
                Large Radius
            </div>

            <div class="box padding1">
                Small Padding
            </div>

            <div class="box padding2">
                Large Padding
            </div>

        </div>

    </main>

    <footer>
        <p>Hover over the boxes</p>
    </footer>

</body>
</html>
