<!DOCTYPE html>
<html>
<head>
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="CSS-Transformations-Showcase.css">
</head>

<body>

    <h1>CSS Transformations</h1>

    <section class="container">

        <div class="item">
            <div class="box rotate">
                Rotate
            </div>
            <p>rotate()</p>
        </div>

        <div class="item">
            <div class="box scale">
                Scale
            </div>
            <p>scale()</p>
        </div>

        <div class="item">
            <div class="box translate">
                Translate
            </div>
            <p>translate()</p>
        </div>

        <div class="item">
            <div class="box skew">
                Skew
            </div>
            <p>skew()</p>
        </div>

    </section>

</body>
</html>
