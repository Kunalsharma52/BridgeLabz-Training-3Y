<!DOCTYPE html>
<html>
<head>
    <title>Typography</title>
    <link rel="stylesheet" href="Typography-Text-Styling.css">
</head>

<body>

    <main>

        <article>

            <h1>Learning Web Design</h1>

            <p class="serif">
                Web design is the process of creating useful and attractive
                websites. Good typography makes websites easier to read.
            </p>

            <p class="sans">
                <strong>HTML</strong> gives structure to a webpage and
                <em>CSS</em> gives style to the webpage.
            </p>

            <p>
                This is <mark>important information</mark> for students.
            </p>

        </article>

    </main>

</body>
</html>
