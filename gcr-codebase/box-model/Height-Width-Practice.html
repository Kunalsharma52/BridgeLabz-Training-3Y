<!DOCTYPE html>
<html>
<head>
    <title>Height and Width</title>
    <link rel="stylesheet" href="Height-Width-Practice.css">
</head>

<body>

    <main class="container">

        <div class="box box1">
            <h2>Box 1</h2>
            <p>Width: 200px</p>
            <p>Height: 150px</p>
        </div>

        <div class="box box2">
            <h2>Box 2</h2>
            <p>Width: 30%</p>
            <p>Height: 20vh</p>
        </div>

        <div class="box box3">
            <h2>Box 3</h2>
            <p>Width: 15em</p>
            <p>Height: 120px</p>

            <p>
                This is extra text to demonstrate overflow.
            </p>
        </div>

    </main>

</body>
</html>
