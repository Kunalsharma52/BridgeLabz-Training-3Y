<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing</title>
    <link rel="stylesheet" href="Box-Sizing.css">
</head>

<body>

    <header>
        <h1>Box-Sizing Comparison</h1>
    </header>

    <main>

        <div class="container">

            <section class="box default-box">

                <h2>Default Box</h2>

                <p>
                    This box uses content-box.
                    Padding and border are added to
                    the declared width.
                </p>

            </section>

            <section class="box border-box">

                <h2>Border-Box</h2>

                <p>
                    This box uses border-box.
                    Padding and border are included
                    inside the declared width.
                </p>

            </section>

        </div>

    </main>

</body>
</html>
