<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>
    <link rel="stylesheet" href="Box-Model-Exploration.css">
</head>

<body>

    <main>

        <h1>CSS Box Model</h1>

        <div class="margin">

            <p>Margin</p>

            <div class="border">

                <p>Border</p>

                <div class="padding">

                    <p>Padding</p>

                    <div class="content">
                        Content
                    </div>

                </div>

            </div>

        </div>

        <p>
            Content is the actual element. Padding is the space inside
            the border. Border surrounds the padding. Margin is outside
            the border.
        </p>

        <div class="border-box">
            box-sizing: border-box
        </div>

    </main>

</body>
</html>
