<!DOCTYPE html>
<html>

<head>
    <title>Dropdown Selection</title>
</head>

<body>

    <h1>Travel Selection</h1>

    <!-- Country -->
    <label>Country:</label>

    <select>

        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>

    </select>

    <br><br>

    <!-- State -->
    <label>State:</label>

    <select>

        <option selected>Haryana</option>
        <option>Punjab</option>
        <option>Delhi</option>
        <option>Rajasthan</option>

    </select>

    <br><br>

    <!-- City -->
    <label>City:</label>

    <select>

        <option selected>Faridabad</option>
        <option>Gurugram</option>
        <option>Panipat</option>
        <option>Hisar</option>

    </select>

    <br><br>

    <!-- Tourist Place -->
    <label>Favorite Tourist Place:</label>

    <select>

        <option selected>Jaipur</option>
        <option>Goa</option>
        <option>Manali</option>
        <option>Agra</option>

    </select>

    <br><br>

    <!-- Summary -->
    <p>
        My country is India, my state is Haryana,
        my city is Faridabad and my favorite tourist
        place is Jaipur.
    </p>

</body>

</html>
