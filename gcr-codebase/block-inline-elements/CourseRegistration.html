<!DOCTYPE html>
<html>

<head>
    <title>Course Registration</title>
</head>

<body>

    <h1>Course Registration Form</h1>

    <!-- Registration form -->
    <form>

        <fieldset>

            <legend>Student Information</legend>

            <!-- Name -->
            <label>Name:</label>
            <input type="text" name="name">

            <br><br>

            <!-- Email -->
            <label>Email:</label>
            <input type="email" name="email">

            <br><br>

            <!-- Course -->
            <label>Select Course:</label>

            <select name="course">

                <option>Cloud Computing</option>
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Data Structures</option>

            </select>

            <br><br>

            <input type="submit" value="Register">

        </fieldset>

    </form>

    <br>

    <!-- Course Schedule -->
    <h2>Available Course Schedule</h2>

    <table border="1">

        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>10:00 AM</td>
            <td>Mr. Sharma</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>12:00 PM</td>
            <td>Ms. Priya</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>2:00 PM</td>
            <td>Mr. Kumar</td>
        </tr>

    </table>

</body>

</html>
