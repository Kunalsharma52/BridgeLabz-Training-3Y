<!DOCTYPE html>
<html>

<head>
    <title>Student Report</title>
</head>

<body>

    <h1>ABC Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td title="English Subject">English</td>
            <td>100</td>
            <td>78</td>
        </tr>

        <tr>
            <td title="Mathematics Subject">Mathematics</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td title="Science Subject">Science</td>
            <td>100</td>
            <td>75</td>
        </tr>

        <tr>
            <td title="Computer Subject">Computer</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td title="Social Science Subject">Social Science</td>
            <td>100</td>
            <td>80</td>
        </tr>

        <tr>
            <td colspan="2"><b>Total</b></td>
            <td><b>405 / 500</b></td>
        </tr>

        <tr>
            <td colspan="2"><b>Percentage</b></td>
            <td><b>81%</b></td>
        </tr>

    </table>

</body>

</html>
