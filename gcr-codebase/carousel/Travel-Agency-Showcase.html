<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Agency</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="question10.css">
</head>

<body>

<header class="bg-primary text-white text-center p-4">

    <h1>Dream Travel</h1>

    <p class="mb-0">
        Explore the World With Us
    </p>

</header>

<main>

    <section class="container py-5">

        <div id="travelCarousel"
             class="carousel slide"
             data-bs-ride="carousel">

            <div class="carousel-indicators">

                <button type="button"
                        data-bs-target="#travelCarousel"
                        data-bs-slide-to="0"
                        class="active">
                </button>

                <button type="button"
                        data-bs-target="#travelCarousel"
                        data-bs-slide-to="1">
                </button>

                <button type="button"
                        data-bs-target="#travelCarousel"
                        data-bs-slide-to="2">
                </button>

            </div>

            <div class="carousel-inner">

                <div class="carousel-item active"
                     data-bs-interval="3000">

                    <img src="https://picsum.photos/1200/500?10"
                         class="d-block w-100"
                         alt="Paris">

                    <div class="carousel-caption">

                        <h2>Paris</h2>

                        <p>
                            Experience the beauty of Paris.
                        </p>

                    </div>

                </div>

                <div class="carousel-item"
                     data-bs-interval="4000">

                    <img src="https://picsum.photos/1200/500?11"
                         class="d-block w-100"
                         alt="Switzerland">

                    <div class="carousel-caption">

                        <h2>Switzerland</h2>

                        <p>
                            Enjoy beautiful mountains and nature.
                        </p>

                    </div>

                </div>

                <div class="carousel-item"
                     data-bs-interval="5000">

                    <img src="https://picsum.photos/1200/500?12"
                         class="d-block w-100"
                         alt="Dubai">

                    <div class="carousel-caption">

                        <h2>Dubai</h2>

                        <p>
                            Discover modern attractions and luxury.
                        </p>

                    </div>

                </div>

            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </section>

    <section class="container py-4">

        <h2 class="text-center">
            Booking Completion
        </h2>

        <div class="progress mt-4"
             role="progressbar"
             aria-label="Booking progress"
             aria-valuenow="70"
             aria-valuemin="0"
             aria-valuemax="100">

            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 style="width: 70%">

                70%

            </div>

        </div>

    </section>

</main>

<footer class="bg-dark text-white text-center p-4 mt-5">

    <h3>
        Contact Us
    </h3>

    <p>
        Email: info@dreamtravel.com
    </p>

    <p>
        Phone: +91 98765 43210
    </p>

    <p class="mb-0">
        © 2026 Dream Travel
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
