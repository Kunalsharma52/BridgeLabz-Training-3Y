<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Entities</h1>

    <p>
        Less than: &lt;
    </p>

    <p>
        Greater than: &gt;
    </p>

    <p>
        Ampersand: &amp;
    </p>

    <p>
        Double Quote: &quot;
    </p>

    <p>
        Single Quote: &apos;
    </p>

    <p>
        Copyright: &copy;
    </p>

    <p>
        Trademark: &trade;
    </p>

    <p>
        Registered: &reg;
    </p>

</body>
</html>
