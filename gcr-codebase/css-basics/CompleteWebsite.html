<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="CompleteWebsite.css">
</head>
<body>

<header>

    <h1>My Website</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</header>

<section class="hero">

    <h1>Welcome to My Website</h1>

</section>

<section class="about">

    <div>
        <h2>About Me</h2>

        <p>
            I am a student learning web development
            and cloud computing.
        </p>
    </div>

    <img src="about.jpg">

</section>

<section class="services">

    <h2>Services</h2>

    <div class="service">

        <div>
            <h3>Web Development</h3>
            <p>We make websites.</p>
        </div>

        <div>
            <h3>Cloud Computing</h3>
            <p>We work with cloud technology.</p>
        </div>

        <div>
            <h3>Design</h3>
            <p>We design websites.</p>
        </div>

    </div>

</section>

<section class="contact">

    <h2>Contact</h2>

    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <textarea placeholder="Message"></textarea>
        <button>Send</button>
    </form>

</section>

<footer>
    <p>Copyright 2026</p>
</footer>

</body>
</html>
