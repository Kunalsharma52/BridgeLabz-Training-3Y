<!DOCTYPE html>
<html>
<head>
    <title>Tooltip Demo</title>
    <link rel="stylesheet" href="tooltips.css">
</head>

<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main>
        <div class="container">

            <div class="tooltip-box">
                HTML
                <span class="tooltip">
                    HTML is used to create webpage structure.
                </span>
            </div>

            <div class="tooltip-box">
                CSS
                <span class="tooltip">
                    CSS is used to style webpages.
                </span>
            </div>

            <div class="tooltip-box">
                Flexbox
                <span class="tooltip">
                    Flexbox is used for easy alignment.
                </span>
            </div>

        </div>
    </main>

</body>
</html>
