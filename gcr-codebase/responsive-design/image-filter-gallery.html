<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>

<header>
    <h1>Image Filter Gallery</h1>
</header>

<main class="gallery">

    <section>
        <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Image">
        <h2>Blur</h2>
    </section>

    <section>
        <img class="gray" src="https://picsum.photos/id/1025/400/300" alt="Image">
        <h2>Grayscale</h2>
    </section>

    <section>
        <img class="sepia" src="https://picsum.photos/id/1035/400/300" alt="Image">
        <h2>Sepia</h2>
    </section>

    <section>
        <img class="brightness" src="https://picsum.photos/id/1043/400/300" alt="Image">
        <h2>Brightness</h2>
    </section>

    <section>
        <img class="contrast" src="https://picsum.photos/id/1050/400/300" alt="Image">
        <h2>Contrast</h2>
    </section>

    <section>
        <img class="hue" src="https://picsum.photos/id/1069/400/300" alt="Image">
        <h2>Hue Rotate</h2>
    </section>

</main>

</body>
</html>
