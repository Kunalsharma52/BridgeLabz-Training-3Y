<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>

<main>
    <h1>Responsive Design Principles</h1>

    <section class="principles">

        <div>
            <h2>Fluid Layouts</h2>
            <p>A fluid layout changes according to screen size.</p>
            <code>width: 100%;</code>
        </div>

        <div>
            <h2>Flexible Media</h2>
            <p>Images should adjust to the available space.</p>
            <code>max-width: 100%;</code>
        </div>

        <div>
            <h2>Breakpoints</h2>
            <p>Breakpoints change the layout at different sizes.</p>
            <code>@media (max-width: 600px)</code>
        </div>

    </section>
</main>

</body>
</html>
