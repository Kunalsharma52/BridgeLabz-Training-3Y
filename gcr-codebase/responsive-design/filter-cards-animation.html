<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

<main>
    <h1>Profile Cards</h1>

    <section class="cards">

        <div class="card">
            <img class="gray" src="https://picsum.photos/id/64/400/300" alt="Profile">
            <h2>John</h2>
            <p>Web Designer</p>
        </div>

        <div class="card">
            <img class="sepia" src="https://picsum.photos/id/91/400/300" alt="Profile">
            <h2>David</h2>
            <p>Developer</p>
        </div>

        <div class="card">
            <img class="gray" src="https://picsum.photos/id/65/400/300" alt="Profile">
            <h2>Sarah</h2>
            <p>Designer</p>
        </div>

    </section>
</main>

</body>
</html>
