<!DOCTYPE html>
<html>
<head>
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="responsive-design.css">
</head>

<body>

    <header>
        <h1>My Mini Website</h1>
    </header>

    <main>

        <section class="card">

            <div class="image">
                <img
                    src="https://picsum.photos/300/200"
                    alt="Sample Image"
                >
            </div>

            <div class="content">

                <h2>Welcome!</h2>

                <p>
                    This is a simple mini user interface
                    created using HTML and CSS.
                </p>

                <form>

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <div class="buttons">

                        <button type="submit">
                            Submit
                        </button>

                        <button type="reset" class="cancel">
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 My Mini Website</p>
    </footer>

</body>
</html>
