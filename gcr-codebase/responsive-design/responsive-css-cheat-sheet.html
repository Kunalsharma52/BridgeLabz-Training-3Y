<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="responsive-css-cheat-sheet.css">
</head>
<body>

<header>
    <h1>Responsive CSS Cheat Sheet</h1>
</header>

<main class="sheet">

    <section>
        <h2>Filters</h2>
        <p>filter: grayscale(100%);</p>
    </section>

    <section>
        <h2>Media Queries</h2>
        <p>@media (max-width: 700px)</p>
    </section>

    <section>
        <h2>Responsive Design</h2>
        <p>Design that works on different screen sizes.</p>
    </section>

    <section>
        <h2>Typography</h2>
        <p>font-size: clamp(1rem, 2vw, 2rem);</p>
    </section>

</main>

</body>
</html>
