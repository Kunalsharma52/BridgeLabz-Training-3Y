<!DOCTYPE html>
<html>
<head>
    <title>Question 10 - Flexbox and Grid</title>
    <link rel="stylesheet" href="responsive-blog-layout.css">
</head>

<body>

    <header>

        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <main>

        <article>

            <h2 class="title">
                Welcome to My Website
            </h2>

            <p>
                This is the main article area.
            </p>

            <div class="boxes">

                <div class="box">
                    <h3>Box 1</h3>
                    <p>First box</p>
                </div>

                <div class="box">
                    <h3>Box 2</h3>
                    <p>Second box</p>
                </div>

                <div class="box">
                    <h3>Box 3</h3>
                    <p>Third box</p>
                </div>

            </div>

        </article>

        <aside>

            <h2>Sidebar</h2>

            <p>
                This is the sidebar.
            </p>

        </aside>

    </main>

    <footer>

        <p>© 2026 My Website</p>

    </footer>

</body>
</html>
