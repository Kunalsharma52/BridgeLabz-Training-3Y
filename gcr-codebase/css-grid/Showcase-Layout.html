<!DOCTYPE html>
<html>
<head>
    <title>Image Showcase</title>
    <link rel="stylesheet" href="Showcase-Layout.css">
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>

        <div class="gallery">

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                    <div class="overlay">Mountain</div>
                </div>
                <figcaption>Beautiful Mountain</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1016/500/350" alt="Nature">
                    <div class="overlay">Nature</div>
                </div>
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1025/500/350" alt="Dog">
                    <div class="overlay">Dog</div>
                </div>
                <figcaption>Cute Dog</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1035/500/350" alt="River">
                    <div class="overlay">River</div>
                </div>
                <figcaption>Beautiful River</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1043/500/350" alt="Forest">
                    <div class="overlay">Forest</div>
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1069/500/350" alt="Beach">
                    <div class="overlay">Beach</div>
                </div>
                <figcaption>Beautiful Beach</figcaption>
            </figure>

        </div>

    </main>

</body>
</html>
