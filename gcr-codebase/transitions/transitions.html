<!DOCTYPE html>
<html>
<head>
    <title>Button Collection</title>
    <link rel="stylesheet" href="transitions.css">
</head>

<body>

    <header>
        <h1>Styled Button Collection</h1>
    </header>

    <main>

        <div class="buttons">

            <button class="primary">
                Primary
            </button>

            <button class="secondary">
                Secondary
            </button>

            <button class="outline">
                Outline
            </button>

            <button disabled>
                Disabled
            </button>

        </div>

    </main>

</body>
</html>
