<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="Custom_Dropdown.css">
</head>
<body>

    <h2>Custom Dropdown</h2>

    <div class="dropdown" id="dropdown">

        <button id="dropdownButton">Select an option</button>

        <div id="options" class="options">

            <div class="option">HTML</div>
            <div class="option">CSS</div>
            <div class="option">JavaScript</div>
            <div class="option">Python</div>

        </div>

    </div>

    <script src="Custom_Dropdown.js"></script>
</body>
</html>
