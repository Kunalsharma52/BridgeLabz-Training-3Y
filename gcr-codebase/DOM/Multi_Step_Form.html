<!DOCTYPE html>
<html>
<head>
    <title>Multi Step Form</title>
    <link rel="stylesheet" href="Multi_Step_Form.css">
</head>
<body>

    <h2>Multi Step Form</h2>

    <div id="step1">
        <h3>Step 1: Name</h3>
        <input type="text" id="name" placeholder="Enter your name">
        <button onclick="nextStep(1)">Next</button>
    </div>

    <div id="step2" class="hidden">
        <h3>Step 2: Email</h3>
        <input type="email" id="email" placeholder="Enter your email">
        <br>
        <button onclick="previousStep(2)">Back</button>
        <button onclick="nextStep(2)">Next</button>
    </div>

    <div id="step3" class="hidden">
        <h3>Step 3: Password</h3>
        <input type="password" id="password" placeholder="Enter password">
        <br>
        <button onclick="previousStep(3)">Back</button>
        <button onclick="nextStep(3)">Submit</button>
    </div>

    <div id="summary" class="hidden">
        <h3>Form Submitted Successfully!</h3>
        <p id="result"></p>
    </div>

    <script src="Multi_Step_Form.js"></script>
</body>
</html>
