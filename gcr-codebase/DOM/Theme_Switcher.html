<!DOCTYPE html>
<html>
<head>
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="Theme_Switcher.css">
</head>
<body data-theme="light">

    <h2>Theme Switcher</h2>

    <button onclick="changeTheme('light')">Light Theme</button>
    <button onclick="changeTheme('dark')">Dark Theme</button>
    <button onclick="changeTheme('blue')">Blue Theme</button>

    <h3>Welcome to Theme Switcher</h3>

    <p>You can change the website theme using buttons.</p>

    <p id="currentTheme">Current Theme: Light</p>

    <script src="Theme_Switcher.js"></script>
</body>
</html>
