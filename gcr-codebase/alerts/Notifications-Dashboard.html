<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="Notifications-Dashboard.css">
</head>

<body>

<header class="bg-primary text-white text-center p-4">

    <h1>Notifications Dashboard</h1>

</header>

<main class="container py-5">

    <div class="card p-4">

        <h2 class="mb-4">
            Your Notifications
        </h2>

        <div class="alert alert-success">
            You have received a new message.
        </div>

        <div class="alert alert-info">
            Your profile is almost complete.
        </div>

        <div class="alert alert-danger">
            Your password will expire soon.
        </div>

        <div class="alert alert-warning alert-dismissible fade show">

            <strong>Important!</strong>
            Please update your profile information.

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>

        <section class="bg-light border p-4 mt-3">

            <h3>
                Summary
            </h3>

            <p>
                You have 4 notifications today.
            </p>

            <p class="mb-0">
                2 messages and 2 account updates.
            </p>

        </section>

    </div>

</main>

<footer class="bg-dark text-white text-center p-4">

    <p class="mb-0">
        © 2026 Notification Center
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
